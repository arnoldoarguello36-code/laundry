<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Þvottafélagið — Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2531; --ink-soft:#4A5568; --steam:#F1EEE7; --card:#FFFFFF; --line:#E4E0D6;
    --teal:#2F8F86; --teal-dark:#1F6B63; --sand:#EFE5CE; --clay:#C2703D;
    --queue:#94A0AA; --accepted:#2F8F86; --progress:#C2703D; --ready:#3B6FC4; --delivered:#3F8A5C;
    --danger:#C24949; --radius:16px;
    --shadow-sm: 0 1px 2px rgba(28,37,49,.06), 0 1px 1px rgba(28,37,49,.04);
    --shadow-md: 0 4px 14px rgba(28,37,49,.08), 0 1px 3px rgba(28,37,49,.06);
    --shadow-lg: 0 12px 32px rgba(28,37,49,.14), 0 2px 6px rgba(28,37,49,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--steam);color:var(--ink);font-family:'Karla',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.015em;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--steam);display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow-lg);}

  /* DESKTOP_BREAKPOINT: 900px — mirrors the JS constant of the same name
     (search "DESKTOP_BREAKPOINT" in <script>). Media queries can't read a JS
     const or a CSS custom property, so this number is kept in sync by hand;
     change both together. Below 900px the layout is unchanged mobile-first
     (#app stays a fixed 480px column). At/above 900px, `body.is-desktop`
     (toggled every render() by isDesktop()) is available as a CSS hook for
     desktop-specific layouts — see T3 (staff sidebar console) and T4 (client
     split-login + list/detail) for the views that actually use it. Views not
     yet redesigned for desktop keep rendering their mobile markup untouched. */
  @media (min-width:900px){
    body.is-desktop #app{max-width:none;box-shadow:none;}

    /* --- T3: desktop staff console shell (sidebar nav + Today KPI grid) --- */
    .ds-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
    .ds-sidebar{background:var(--ink);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:28px;}
    .ds-brand{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:#fff;letter-spacing:.01em;}
    .ds-brand-sub{display:block;font-family:'Karla',sans-serif;font-size:11px;color:#9AA5B5;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
    .ds-nav{display:flex;flex-direction:column;gap:2px;}
    .ds-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:none;background:none;color:#C7CEDA;text-decoration:none;font-size:14px;font-weight:600;font-family:inherit;text-align:left;cursor:pointer;}
    .ds-nav button.active{background:var(--teal);color:#fff;}
    .ds-nav button:hover:not(.active){background:rgba(255,255,255,.06);color:#fff;}
    .ds-sidebar-foot{margin-top:auto;font-size:12px;color:#8B94A3;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
    .ds-sidebar-foot button{margin-top:6px;background:none;border:none;color:#C7CEDA;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0;}
    .ds-sidebar-foot button:hover{color:#fff;}
    .ds-main{padding:32px 40px;max-width:1240px;}
    .ds-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:16px;}
    .ds-topbar h1{font-size:24px;margin:0;font-weight:600;}
    .ds-meta{color:var(--ink-soft);font-size:13px;margin-top:4px;}
    .ds-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
    .ds-kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);text-align:left;cursor:pointer;font-family:inherit;}
    .ds-kpi .n{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--ink);}
    .ds-kpi .l{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:4px;}
    .ds-kpi.alert{border-color:var(--clay);}
    .ds-kpi.alert .n{color:var(--clay);}
    .ds-kpi.warn{border-color:#C9A227;}
    .ds-kpi.warn .n{color:#9C7F1E;}
    .ds-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;}
    .ds-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-sm);}
    .ds-panel h2{font-size:15px;margin:0 0 4px;font-weight:600;}
    .ds-panel .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
    .ds-table{width:100%;border-collapse:collapse;font-size:13.5px;}
    .ds-table th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);}
    .ds-table td{padding:10px 10px;border-bottom:1px solid var(--line);}
    .ds-table tbody tr:last-child td{border-bottom:none;}
    .ds-note{margin-top:14px;padding:10px 12px;background:var(--steam);border-radius:10px;font-size:12px;color:var(--ink-soft);}
    /* .price-line inside .ds-panel reuses the existing mobile price-line rules
       (color/spacing already match the mockup 1:1 — no override needed), it
       just needs the flex name/qty split the mockup uses instead of the
       mobile amount/qty-name pairing. */
    .ds-panel .price-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
    .ds-panel .price-line:last-of-type{border-bottom:none;}
    .ds-panel .price-line .name{font-weight:600;}
    .ds-panel .price-line .qty{color:var(--ink-soft);}
    .ds-topbar-actions{display:flex;align-items:center;gap:14px;}
    .ds-new-order-btn{width:auto;padding:11px 20px;font-size:14px;}

    /* --- T5: admin desktop shell — card-list tabs (orders/clients/quotes/failed)
       reuse the mobile card markup as-is, laid out as a responsive grid instead
       of a single stacked column; controls above the list (add buttons, filter
       bars, banners, inline edit forms) span the full width. --- */
    .ds-content-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start;}
    .ds-content-cards > .add-item,
    .ds-content-cards > .quick-chip,
    .ds-content-cards > .client-select-row,
    .ds-content-cards > .filters,
    .ds-content-cards > .empty-state,
    .ds-content-cards > .admin-banner,
    .ds-content-cards > .product-edit-form{grid-column:1/-1;}
    /* Form-heavy tabs (products/pricing) stay single-column at a readable width. */
    .ds-content-form{max-width:640px;}

    /* --- T6: bespoke desktop dashboard (Reports/Volume) — a distinct visual
       language from the T3 Today ds-kpi/ds-panel shell: a KPI hero strip
       above a bento grid of chart cards. Shared by staff & admin desktop
       shells (both call renderDesktopReports(); Volume is admin-only). --- */
    .dash-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow-sm);}
    .dash-hero-cell{background:var(--card);padding:20px 18px;}
    .dash-hero-cell .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--ink);}
    .dash-hero-cell .l{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
    .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start;margin-bottom:18px;}
    .dash-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);}
    .dash-card.span-2{grid-column:span 2;}
    .dash-card.span-3{grid-column:1/-1;}
    .dash-card h3{font-size:14px;margin:0 0 3px;}
    .dash-card .sub{font-size:11.5px;color:var(--ink-soft);margin:0 0 14px;}

    /* --- T4: desktop split-screen login/register/forgot --- */
    .ds-auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
    .ds-split{max-width:1040px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);min-height:560px;}
    .ds-split-brand{background:var(--ink);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
    .ds-split-brand::after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(47,143,134,.35),transparent 70%);}
    .ds-split-brand p{color:#C7CEDA;font-size:15px;line-height:1.6;max-width:340px;position:relative;z-index:1;}
    .ds-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);font-weight:700;position:relative;z-index:1;}
    .ds-trust{margin-top:auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;}
    .ds-trust-row{display:flex;gap:10px;align-items:center;font-size:13.5px;color:#DCE2EA;}
    .ds-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0;}
    .ds-split-form{background:var(--card);padding:56px 48px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;}
    .ds-form-kicker{font-size:12px;color:var(--teal-dark);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
    .ds-split-form h1{font-size:24px;margin:0 0 8px;}
    .ds-form-sub{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}

    /* --- T4/E4: desktop client My Orders (list + detail) --- */
    .ds-client-cols{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
    .ds-list-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
    .ds-list-head{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
    .ds-list-head h2{margin:0 0 10px;font-size:17px;}
    .ds-list-head .staff-tabs{margin:0;}
    .ds-order-row{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;}
    .ds-order-row:last-child{border-bottom:none;}
    .ds-order-row.active{background:var(--steam);border-left:3px solid var(--teal);}
    .ds-order-row .oid{font-size:12px;color:var(--ink-soft);font-weight:700;}
    .ds-order-row .items{font-size:14px;font-weight:600;margin:2px 0;}
    .ds-list-empty{padding:28px 18px;color:var(--ink-soft);font-size:13.5px;text-align:center;}
    .ds-detail-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow-sm);}
    .ds-detail-panel h2{margin:0 0 4px;font-size:22px;}
    .ds-detail-panel .sub{color:var(--ink-soft);font-size:14px;margin-bottom:8px;}
  }

  .topbar{padding:16px 18px 12px;display:flex;flex-direction:column;background:var(--card);position:sticky;top:0;z-index:20;gap:10px;box-shadow:var(--shadow-sm);}
  .topbar-brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .topbar-modes{display:flex;justify-content:center;}
  .brand{display:flex;flex-direction:column;line-height:1.05;}
  .brand .name{font-size:18px;font-weight:700;letter-spacing:-0.02em;}
  .brand .tag{font-size:9.5px;color:#8a929e;letter-spacing:.08em;text-transform:uppercase;margin-top:3px;font-weight:600;}
  .lang-switch{display:flex;background:var(--steam);border:1px solid var(--line);border-radius:999px;padding:3px;font-size:11px;}
  .lang-switch button{border:none;background:transparent;padding:5px 9px;border-radius:999px;font-family:inherit;font-weight:700;color:#8a929e;cursor:pointer;transition:all .15s;}
  .lang-switch button.active{background:var(--ink);color:#fff;box-shadow:var(--shadow-sm);}
  .mode-switch{display:flex;background:var(--steam);border:1px solid var(--line);border-radius:999px;padding:3px;font-size:10.5px;}
  .mode-switch button{border:none;background:transparent;padding:6px 8px;border-radius:999px;font-family:inherit;font-weight:600;color:#8a929e;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .mode-switch button.active{background:var(--ink);color:#fff;box-shadow:var(--shadow-sm);}

  .auth-screen{padding:28px 26px 40px;display:flex;flex-direction:column;gap:14px;flex:1;}
  .auth-hero{margin-bottom:2px;}
  .auth-hero .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-dark);font-weight:700;margin-bottom:8px;}
  .auth-hero h1{font-size:26px;margin:0 0 6px;}
  .auth-hero p{margin:0;color:#4A5568;font-size:14px;line-height:1.5;}
  label{font-size:12px;font-weight:600;color:#565f68;display:block;margin-bottom:6px;}
  input,select,textarea{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-size:15px;color:var(--ink);transition:border-color .15s, box-shadow .15s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(62,142,136,.15);}
  .field{margin-bottom:14px;}
  .btn{border:none;border-radius:10px;padding:13px 16px;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;text-align:center;}
  .btn-primary{background:var(--ink);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-clay{background:var(--clay);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink);text-decoration:underline;font-weight:600;padding:8px;}
  .btn-sm{padding:9px 12px;font-size:12.5px;}
  .switch-link{font-size:13px;color:#4A5568;text-align:center;margin-top:6px;}
  .switch-link a{color:var(--teal-dark);font-weight:600;cursor:pointer;text-decoration:none;}

  .content{flex:1;padding:16px 18px 100px;overflow-y:auto;}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#8a929e;font-weight:700;margin:20px 0 10px;}
  .section-title:first-child{margin-top:2px;}
  .subsection-title{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--ink);}

  .order-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .order-card .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .order-card .oid{font-size:11px;color:#96a0a8;font-weight:600;}
  .order-card h3{font-size:16px;margin:2px 0 4px;}
  .order-card .meta{font-size:12.5px;color:#4A5568;margin:0;}
  .order-card .comment{font-size:12.5px;color:#4A5568;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-style:italic;}
  .badge{font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;color:#fff;letter-spacing:.02em;text-transform:uppercase;}
  .badge.en-cola{background:var(--queue);}
  .badge.aceptado{background:var(--accepted);}
  .badge.en-proceso{background:var(--progress);}
  .badge.listo{background:var(--ready);}
  .badge.entregado{background:var(--delivered);}
  .badge-mini{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;margin-right:5px;display:inline-block;}
  .badge-mini.urgent{background:var(--clay);}
  .badge-mini.delivery{background:#3E6FBF;}
  .badge-mini.pickup{background:#6B5B95;}
  .badge-mini.problem{background:var(--danger);}
  .badge-row{margin-bottom:4px;}

  .price-line{display:flex;justify-content:space-between;font-size:12.5px;color:#4A5568;padding:3px 0;}
  .price-line .amount{font-weight:600;color:var(--ink);}
  .price-line.pending .amount{color:var(--clay);font-style:italic;font-weight:600;}
  .price-total{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:14px;font-weight:700;}
  .price-total .amount{font-family:'Fraunces',serif;font-size:16px;}
  .price-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}

  .pipeline{display:flex;align-items:center;margin:12px 0 4px;position:relative;}
  .pipeline::before{content:"";position:absolute;left:8px;right:8px;top:5px;height:1.5px;background:var(--line);}
  .pin{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;}
  .pin .dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--line);margin-bottom:5px;}
  .pin.done .dot{background:var(--teal);border-color:var(--teal);}
  .pin.current .dot{background:var(--clay);border-color:var(--clay);box-shadow:0 0 0 4px rgba(194,112,61,.18);}
  .pin span.label{font-size:9px;color:#8a949c;text-align:center;font-weight:600;}
  .pin.done span.label,.pin.current span.label{color:var(--ink);}

  .fab{position:sticky;bottom:16px;align-self:center;margin:14px auto 0;width:calc(100% - 36px);}
  .fab .btn{width:100%;padding:15px;font-size:15px;}

  .bottomnav{display:flex;background:var(--card);position:sticky;bottom:0;box-shadow:0 -2px 12px rgba(28,37,49,.07);}
  .bottomnav button{flex:1;border:none;background:transparent;padding:11px 4px 9px;font-family:inherit;font-size:10.5px;font-weight:600;color:#8a929e;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .bottomnav button.active{color:var(--ink);}
  .bottomnav button .ic{font-size:16px;}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(20,26,31,.45);z-index:40;display:none;}
  .sheet-backdrop.open{display:block;}
  .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:var(--steam);border-radius:22px 22px 0 0;z-index:41;max-height:90vh;overflow-y:auto;padding:20px 20px 30px;display:none;box-shadow:0 -8px 40px rgba(28,37,49,.22);}
  .sheet.open{display:block;}
  .sheet-handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
  .sheet h2{font-size:20px;margin:0 0 4px;}
  .sheet .sub{font-size:13px;color:#4A5568;margin:0 0 18px;}
  .item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .item-row select{flex:2;min-width:120px;}
  .item-row input.qty-input{flex:0 0 62px;}
  .item-row .qty-unit{flex:0 0 auto;font-size:12px;color:#8a929e;font-weight:600;margin-left:-2px;}
  .item-row input.other-input{flex:2 1 100%;order:3;}
  .item-row button{border:none;background:var(--card);border:1px solid var(--line);border-radius:8px;width:36px;height:44px;color:var(--danger);font-size:16px;cursor:pointer;}
  .item-price-hint{font-size:11px;color:#8a929e;margin:-2px 0 10px 2px;}
  .item-price-hint.pending{color:var(--clay);font-weight:600;}
  .add-item{background:none;border:1px dashed var(--line);color:var(--teal-dark);border-radius:10px;padding:10px;width:100%;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:16px;}

  .checkbox-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:13.5px;font-weight:600;color:#444e57;}
  .checkbox-row input{width:auto;accent-color:var(--teal);}
  .checkbox-row .fee{margin-left:auto;font-size:11.5px;color:#8a929e;font-weight:600;}
  .pickup-section{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;}

  .order-total-preview{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .order-total-preview .row{display:flex;justify-content:space-between;font-size:13px;color:#4A5568;padding:3px 0;}
  .order-total-preview .row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:15px;color:var(--ink);}
  .order-total-preview .note{font-size:11px;color:var(--clay);margin-top:4px;font-weight:600;}

  .staff-tabs{display:flex;gap:3px;margin-bottom:16px;background:#E9E5DA;border-radius:12px;padding:4px;overflow-x:auto;}
  .staff-tabs button{flex:1;border:none;background:transparent;padding:9px 3px;border-radius:9px;font-family:inherit;font-weight:700;font-size:10.5px;color:#6b7280;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .staff-tabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);}

  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
  .filters button{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;color:#4A5568;cursor:pointer;white-space:nowrap;}
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm);}
  .client-select-row{margin-bottom:14px;}

  .staff-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

/* ============ ESTADO Y PERSISTENCIA ============ */
const ESTADOS = ["en-cola","aceptado","en-proceso","listo","entregado"];
function statusLabel(e){ return t('status')[e]; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isToday(ts){ return new Date(ts).toDateString() === new Date().toDateString(); }
function isOverdue(o){ return o.fecha < todayISO() && o.estado !== 'entregado'; }

// Desktop breakpoint: 900px, kept in sync with the CSS `@media (min-width:900px)`
// block below (search "DESKTOP_BREAKPOINT" in <style> for the matching comment).
// Single source of truth for the number lives here in JS; CSS mirrors it by hand
// since media queries can't read a JS constant or a CSS custom property.
const DESKTOP_BREAKPOINT = 900;
const desktopMql = window.matchMedia(`(min-width:${DESKTOP_BREAKPOINT}px)`);
function isDesktop(){ return desktopMql.matches; }

// render() does a full innerHTML re-render (no diffing), so a raw resize
// listener firing on every drag tick would be visibly janky. Debounce the
// breakpoint-crossing re-render instead of reacting to every match-state flip.
let desktopMqlDebounce = null;
desktopMql.addEventListener('change', ()=>{
  clearTimeout(desktopMqlDebounce);
  desktopMqlDebounce = setTimeout(()=>{
    // Same guard startPolling() uses — never blow away an open form mid-edit
    // just because the viewport crossed the desktop breakpoint.
    if(sheetOpen || addingClient || editingClientId || addingProduct || editingProductId) return;
    render();
  }, 150);
});

function priceEntry(key){ return db.products.find(p=>p.key===key) || db.products.find(p=>p.key==='other'); }
// Staff-only products (e.g. "Gull"/kilos amarillos) are hidden from the
// client-facing self-service order sheet (sheetMode==='client') but remain
// selectable in the staff/admin manual-order sheet (sheetMode==='manual').
// This is a client-side convenience filter only — the real enforcement is
// the order_items_insert_client RLS policy (staff_only_products migration),
// which rejects a client-originated insert referencing a staff-only product
// regardless of what the UI shows.
function activeProducts(){ return [...db.products].filter(p=>p.active && (!p.staffOnly || sheetMode==='manual')).sort((a,b)=>a.sortOrder-b.sortOrder); }
function fmtISK(n){ return Math.round(n).toLocaleString(lang==='is'?'is-IS':'en-GB') + ' kr.'; }

function computeItemCost(it){
  if(it.priceOverride!=null) return it.priceOverride * it.cant;
  const p = priceEntry(it.tipo);
  if(p.price === null) return null;
  return p.price * it.cant;
}
function computeOrderTotals(items, mods){
  mods = mods || {};
  let itemsTotal = 0, hasPending = false;
  items.forEach(it=>{ const c = computeItemCost(it); if(c===null) hasPending=true; else itemsTotal+=c; });
  const expressFee = mods.urgent ? Math.round(itemsTotal * (db.settings.expressPercent/100)) : 0;
  const deliveryFee = mods.returnMethod==='delivery' ? db.settings.deliveryFee : 0;
  const pickupFee = mods.pickup ? db.settings.pickupFee : 0;
  const discount = db.settings.discountPercent ? Math.round(itemsTotal * (db.settings.discountPercent/100)) : 0;
  const total = Math.max(0, itemsTotal + expressFee + deliveryFee + pickupFee - discount);
  return {itemsTotal, expressFee, deliveryFee, pickupFee, discount, total, hasPending};
}

/* ============ SUPABASE DATA LAYER ============ */
// Front-end keeps the same in-memory `db` shape the render functions already
// expect (products/settings/orders/users/emailLog, camelCase fields) — per
// the locked T5 scope ("Supabase client calls behind the existing db
// in-memory cache"). These functions populate that cache asynchronously
// instead of reading it synchronously from localStorage. Mutations call a
// Supabase RPC/insert/update, then re-run the relevant loader(s) below and
// re-render — there's no local optimistic mutation of `db` anymore.
let db = {
  users: [], products: [], settings: { expressPercent:0, deliveryFee:0, pickupFee:0, discountPercent:0, deliveryEnabled:true, pickupEnabled:true },
  orders: [], emailLog: []
};

function mapProfile(p){
  return { id:p.id, name:p.name, email:p.email, phone:p.phone, registeredAt: p.registered_at ? new Date(p.registered_at).getTime() : Date.now(), notificationsEnabled: p.notifications_enabled !== false, isContract: !!p.is_contract, role: p.role, preferredLang: p.preferred_lang };
}
function mapProduct(p){
  return { id:p.id, key:p.id, en:p.name_en, is:p.name_is, price: p.price===null||p.price===undefined ? null : Number(p.price), unit:p.unit, category:p.category, active:p.active, sortOrder:p.sort_order, staffOnly: !!p.staff_only };
}
function mapSettings(s){
  return { expressPercent:Number(s.express_percent), deliveryFee:Number(s.delivery_fee), pickupFee:Number(s.pickup_fee), discountPercent:Number(s.discount_percent), deliveryEnabled:s.delivery_enabled, pickupEnabled:s.pickup_enabled };
}
function mapOrder(o){
  return {
    id:o.id, userId:o.client_id, clientName:o.client_name, fecha:o.fecha, comentarios:o.comentarios||'',
    items:(o.order_items||[]).map(it=>({ id:it.id, tipo:it.product_id, cant:Number(it.qty), priceOverride: it.price_override===null||it.price_override===undefined ? null : Number(it.price_override), desc:it.desc||'' })),
    estado:o.estado, urgent:o.urgent, returnMethod:o.return_method, pickup:o.pickup, pickupAddress:o.pickup_address||'', problem:o.problem, source:o.source,
    notas:o.notas||[], creado: new Date(o.created_at).getTime(), deliveredAt: o.delivered_at ? new Date(o.delivered_at).getTime() : null
  };
}
// Client-submitted orders (source==='client') always have client_name===null in
// the DB (only client_id is set — see the sb.from('orders').insert(...) call in
// btnSubmitOrden's onclick) — only staff-logged manual/walk-in orders populate
// client_name directly. Every place that displays a client's name for an order
// must go through this helper, or a client-placed order renders the literal
// string "null" (found live in the staff Orders tab on ORD-1000 during QA).
function orderClientName(o){
  if(o.clientName) return o.clientName;
  const u = db.users.find(u=>u.id===o.userId);
  return u ? u.name : t('client_unknown');
}

async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('sort_order', {ascending:true});
  if(error){ console.error('loadProducts', error); toast(t('err_generic')); return; }
  db.products = (data||[]).map(mapProduct);
}
async function loadSettings(){
  const { data, error } = await sb.from('settings').select('*').eq('id', 1).single();
  if(error){ console.error('loadSettings', error); toast(t('err_generic')); return; }
  db.settings = mapSettings(data);
}
async function loadOrders(){
  // RLS scopes this automatically: clients only ever get their own rows back,
  // staff/admin get everything — no manual client_id filter needed.
  const { data, error } = await sb.from('orders')
    .select('*, order_items(id, product_id, qty, price_override, desc)')
    .order('created_at', {ascending:false});
  if(error){ console.error('loadOrders', error); toast(t('err_generic')); return; }
  db.orders = (data||[]).map(mapOrder);
}
async function loadUsers(){
  // `db.users` is (and always was) "clients only" — staff/admin accounts
  // never appear in this list.
  const { data, error } = await sb.from('profiles').select('*').eq('role','client').order('registered_at', {ascending:true});
  if(error){ console.error('loadUsers', error); toast(t('err_generic')); return; }
  db.users = (data||[]).map(mapProfile);
}
async function loadEmailLog(){
  const { data, error } = await sb.from('email_log').select('*').order('sent_at', {ascending:false}).limit(200);
  if(error){ console.error('loadEmailLog', error); toast(t('err_generic')); return; }
  db.emailLog = (data||[]).map(e=>({ to:e.to_address, subject:e.subject, body:e.body, ts:new Date(e.sent_at).getTime(), status:e.status }));
}
async function loadDataForSession(){
  await loadProducts();
  await loadSettings();
  // loadUsers() is safe to call unconditionally: RLS scopes the result to
  // just the caller's own row for a plain client, and to the full client
  // list for staff/admin. A plain client needs their own row present in
  // db.users for the "Hi, {name}" greeting in renderClienteView().
  await Promise.all([loadOrders(), loadUsers()]);
  // email_log is staff/admin-only per RLS (T8's failed-email admin panel and
  // the staff "emails" tab both read db.emailLog) — no point fetching it for
  // a plain client, who'd get an RLS-empty result anyway.
  if(session.actualRole === 'staff' || session.actualRole === 'admin'){
    await loadEmailLog();
  }
}

/* ---- 20s polling refresh for staff/admin (skipped while a form is open, so it never clobbers in-progress edits) ---- */
function startPolling(){
  setInterval(async ()=>{
    if(!session.role || session.role === 'client') return;
    if(sheetOpen || addingClient || editingClientId || addingProduct || editingProductId) return;
    await Promise.all([loadOrders(), loadEmailLog()]);
    render();
  }, 20000);
}

// T5/T3 note: notas entries are now structured jsonb objects written server-
// side by the advance_order_status/add_order_note/flag_problem RPCs, shaped
// {kind:'status'|'note'|'problem'|'resolved', ..., at}. The old plain-string
// markers ('__status__:x', '__problem__', etc.) only existed in the
// prototype's localStorage seed data and can't appear in real rows anymore.
function noteText(n){
  if(!n || typeof n !== 'object') return n ?? '';
  if(n.kind === 'status') return t('status_updated_note')+' "'+statusLabel(n.estado)+'".';
  if(n.kind === 'problem') return t('problem_note');
  if(n.kind === 'resolved') return t('resolved_note');
  if(n.kind === 'note') return n.text;
  return '';
}

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById('app');
  document.body.classList.toggle('is-desktop', isDesktop());
  // Password-recovery deep link stays mobile-styled at every viewport — it's
  // a one-off screen reached from an email link, not part of the T4 mockup
  // (which only covers login/register/forgot + My Orders), so a desktop
  // split-screen treatment wasn't designed for it.
  if(authScreen === 'recovery'){ app.innerHTML = renderTopbar() + renderRecoveryScreen(); bindEvents(); return; }
  if(!session.role){ app.innerHTML = isDesktop() ? renderDesktopAuth() : renderTopbar() + renderAuth(); }
  else if(session.role === 'client'){ app.innerHTML = isDesktop() ? renderDesktopClienteView() + renderSheet() : renderTopbar() + renderClienteView() + renderSheet(); }
  else if(session.role === 'staff'){ app.innerHTML = isDesktop() ? renderDesktopStaffShell() + renderSheet() : renderTopbar() + renderStaffView() + renderSheet(); }
  else { app.innerHTML = isDesktop() ? renderDesktopAdminShell() + renderSheet() : renderTopbar() + renderAdminView() + renderSheet(); }
  bindEvents();
}
function renderLangSwitch(){
  return `<div class="lang-switch"><button data-lang="en" class="${lang==='en'?'active':''}">EN</button><button data-lang="is" class="${lang==='is'?'active':''}">IS</button></div>`;
}

function renderTopbar(){
  const logo = brandLogoSvg();
  // Mode-switch (client/staff/admin view toggle) is an admin-only power-user
  // control — gated on session.actualRole (the real authenticated role, not
  // viewMode, which admin can temporarily change to preview other views).
  // Client/staff users never had a legitimate use for this control: staff
  // could only ever switch into their own "staff" view, and client into
  // "client" — every other option just produced a role-mismatch toast. So
  // this isn't just hiding UI, it's removing a control that only ever did
  // one useful thing per non-admin role, done better already by login.
  const isAdmin = session.actualRole === 'admin';
  return `
  <div class="topbar">
    <div class="topbar-brandrow">
      <div class="brand" style="flex-direction:row;align-items:center;gap:9px;">
        ${logo}
      </div>
      ${renderLangSwitch()}
    </div>
    ${isAdmin ? `
    <div class="topbar-modes">
      <div class="mode-switch">
        <button data-switch="client" class="${viewMode==='client'?'active':''}">${t('tab_cliente')}</button>
        <button data-switch="staff" class="${viewMode==='staff'?'active':''}">${t('tab_staff')}</button>
        <button data-switch="admin" class="${viewMode==='admin'?'active':''}">${t('tab_admin')}</button>
      </div>
    </div>` : ``}
  </div>`;
}

/* ============ AUTH ============ */
// Shared between mobile renderAuth() and desktop renderDesktopAuth() (T4) so
// hero copy and form fields can't drift between the two layouts — only the
// surrounding chrome (single column vs. split brand/form panes) differs.
function authScreenMeta(){
  if(authScreen==='forgot') return {eyebrow:'', title:t('forgot_password_title'), sub:t('forgot_password_sub')};
  if(authScreen==='registro') return {eyebrow:t('first_time'), title:t('register_title'), sub:t('register_sub')};
  return {eyebrow:t('welcome_back'), title:t('login_title'), sub:t('login_sub')};
}
function authFieldsHtml(){

function pipelineHtml(estado){
  const idx = ESTADOS.indexOf(estado);
  return `<div class="pipeline">` + ESTADOS.map((e,i)=>{
    let cls = i<idx?'done':(i===idx?'current':'');
    return `<div class="pin ${cls}"><div class="dot"></div><span class="label">${statusLabel(e)}</span></div>`;
  }).join('') + `</div>`;
}
function badgeRow(o){
  let b = '';
  if(o.urgent) b += `<span class="badge-mini urgent">${lang==='is'?'HRAÐ':'URGENT'}</span>`;
  if(o.returnMethod==='delivery') b += `<span class="badge-mini delivery">${lang==='is'?'SENDING':'DELIVERY'}</span>`;
  if(o.pickup) b += `<span class="badge-mini pickup">${lang==='is'?'SÆKJA':'PICKUP'}</span>`;
  if(o.problem) b += `<span class="badge-mini problem">${lang==='is'?'VANDAMÁL':'ISSUE'}</span>`;
  if(o.source==='staff') b += `<span class="badge-mini" style="background:#6B5B95;">${t('manual_badge')}</span>`;
  return b ? `<div class="badge-row">${b}</div>` : '';
}
function priceBlockHtml(o){
  const {itemsTotal, expressFee, deliveryFee, pickupFee, discount, total, hasPending} = computeOrderTotals(o.items, o);
  const lines = o.items.map(it=>{
    const p = priceEntry(it.tipo);
    const label = it.tipo==='other' ? (it.desc || t('other_ph')) : (p[lang]||p.en);
    const cost = computeItemCost(it);
    return `<div class="price-line ${cost===null?'pending':''}"><span>${it.cant}× ${label}</span><span class="amount">${cost===null ? t('quote_pending_item') : fmtISK(cost)}</span></div>`;
  }).join('');
  const extraLines = [
    expressFee>0 ? `<div class="price-line"><span>${t('express_fee')}</span><span class="amount">${fmtISK(expressFee)}</span></div>` : '',
    deliveryFee>0 ? `<div class="price-line"><span>${t('delivery_fee')}</span><span class="amount">${fmtISK(deliveryFee)}</span></div>` : '',
    pickupFee>0 ? `<div class="price-line"><span>${t('pickup_fee')}</span><span class="amount">${fmtISK(pickupFee)}</span></div>` : '',
    discount>0 ? `<div class="price-line"><span>${t('discount')}</span><span class="amount">-${fmtISK(discount)}</span></div>` : ''
  ].join('');
  return `<div class="price-block">${lines}${extraLines}
    <div class="price-total"><span>${t('order_total')}</span><span class="amount">${fmtISK(total)}${hasPending? ' +':''}</span></div>
    ${hasPending ? `<div class="item-price-hint pending">${t('quote_pending_note')}</div>` : ''}
  </div>`;
}
function renderOrderCardCliente(o){
  const itemsStr = o.items.map(it=>{ const p = priceEntry(it.tipo); const label = it.tipo==='other' ? (it.desc||t('other_ph')) : (p[lang]||p.en); return `${it.cant}× ${label}`; }).join(', ');
  const lastNote = o.notas[o.notas.length-1];
  return `
  <div class="order-card">
    ${badgeRow(o)}
    <div class="row-top"><div><div class="oid">${o.id}</div><h3>${itemsStr}</h3><p class="meta">${t('requested_delivery')}: ${fmtFecha(o.fecha)}</p></div><span class="badge ${o.estado}">${statusLabel(o.estado)}</span></div>
    ${o.pickup && o.pickupAddress ? `<div class="comment">📍 ${t('pickup_address_note')}: ${o.pickupAddress}</div>` : ``}
    ${pipelineHtml(o.estado)}
    ${priceBlockHtml(o)}
    ${lastNote ? `<div class="comment">📝 ${noteText(lastNote)}</div>` : ``}
  </div>`;
}
function fmtFecha(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString(lang==='is'?'is-IS':'en-GB',{day:'2-digit',month:'short'}); }
function fmtDateTime(ts){ const d = new Date(ts); const l = lang==='is'?'is-IS':'en-GB'; return d.toLocaleDateString(l,{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString(l,{hour:'2-digit',minute:'2-digit'}); }

// Pure aggregation, shared by mobile renderStaffToday() and desktop
// renderDesktopToday() (T3/E3) — takes plain data in so it's also callable
// from node --test without booting the whole app (see E7/test/layout.test.js).
function computeTodaySummary(orders, users){
  const dueToday = orders.filter(o=>o.fecha===todayISO() && o.estado!=='entregado');
  const receivedToday = orders.filter(o=>isToday(o.creado));
  const overdue = orders.filter(isOverdue);
  const urgent = orders.filter(o=>o.urgent && o.estado!=='entregado');
  const problems = orders.filter(o=>o.problem);
  const inProgress = orders.filter(o=>o.estado==='en-proceso');
  const ready = orders.filter(o=>o.estado==='listo');
  const contractUsers = users.filter(u=>u.isContract);
  const contractToday = contractUsers.map(u=>{
    const uOrders = orders.filter(o=>o.userId===u.id && isToday(o.creado));
    const qty = uOrders.reduce((s,o)=>s+o.items.reduce((s2,it)=>s2+it.cant,0),0);
    return {name:u.name, qty, orders:uOrders.length};
  }).filter(c=>c.orders>0).sort((a,b)=>b.qty-a.qty);
  return {dueToday, receivedToday, overdue, urgent, problems, inProgress, ready, contractUsers, contractToday};
}

/* ---- Generic SVG horizontal bar chart ---- */
function svgHBar(rows, opts){
  opts = opts || {};
  const w=320, barH=opts.barH||20, gap=opts.gap||14, leftPad=opts.leftPad||96, rightPad=10;
  const trackW = w - leftPad - rightPad;
  const max = Math.max(1, ...rows.map(r=>r.value));
  const body = rows.map((r,i)=>{
    const bw = trackW*(r.value/max); const y=i*(barH+gap);
    const label = r.label.length>14 ? r.label.slice(0,13)+'…' : r.label;
    const valueLabel = opts.fmt ? opts.fmt(r.value) : r.value;
    return `<text x="0" y="${y+barH*0.68}" font-size="10.5" font-weight="600" fill="#4A5568" font-family="Karla,sans-serif">${label}</text>
      <rect x="${leftPad}" y="${y}" width="${trackW}" height="${barH}" rx="6" fill="#F0EDE5"/>
      <rect x="${leftPad}" y="${y}" width="${Math.max(bw, r.value>0?4:0)}" height="${barH}" rx="6" fill="${r.color||'#2F8F86'}"/>
      <text x="${w-rightPad}" y="${y+barH*0.68}" text-anchor="end" font-size="10.5" font-weight="700" fill="#1C2531" font-family="Karla,sans-serif">${valueLabel}</text>`;
  }).join('');
  const totalH = rows.length*(barH+gap)-gap;
  return `<svg viewBox="0 0 ${w} ${Math.max(totalH,barH)+4}" width="100%" style="overflow:visible">${body}</svg>`;
}
function svgVolumeLine(days){
  const w=300,h=110,padL=4,padB=16;
  const max = Math.max(1, ...days.map(d=>d.count));
  const stepX = (w-padL*2)/(days.length-1);
  const pts = days.map((d,i)=>{ const x=padL+i*stepX; const y=(h-padB)-((d.count/max)*(h-padB-10)); return {x,y,count:d.count,date:d.date}; });
  const pathD = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1].x.toFixed(1)},${h-padB} L${pts[0].x.toFixed(1)},${h-padB} Z`;
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="#3E8E88"/>`).join('');
  const labels = pts.map((p,i)=>{
    if(i%3!==0 && i!==pts.length-1) return '';
    const lbl = p.date.toLocaleDateString(lang==='is'?'is-IS':'en-GB',{day:'2-digit',month:'2-digit'});
    return `<text x="${p.x.toFixed(1)}" y="${h}" font-size="8.5" fill="#8a929e" text-anchor="middle" font-family="Karla,sans-serif">${lbl}</text>`;
  }).join('');
  return `<svg viewBox="-16 0 ${w+32} ${h+6}" width="100%" style="overflow:visible"><path d="${areaD}" fill="rgba(47,143,134,.12)" stroke="none"/><path d="${pathD}" fill="none" stroke="#2F8F86" stroke-width="2"/>${dots}${labels}</svg>`;
}
const STATUS_COLOR = {"en-cola":"#9AA5AD","aceptado":"#3E8E88","en-proceso":"#C2703D","listo":"#3E6FBF","entregado":"#4E8B5C"};

/* ---- Reports (shared by Staff & Admin) ---- */
function computeReports(){
  const now = new Date();
  const startOfDay = new Date(now); startOfDay.setHours(0,0,0,0);
  const startOfWeek = new Date(startOfDay); startOfWeek.setDate(startOfWeek.getDate()-startOfWeek.getDay());
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfYear = new Date(now.getFullYear(), 0, 1);

  function ordersSince(d){ return db.orders.filter(o=>o.creado>=d.getTime()); }
  function revenueOf(orders){ return orders.reduce((s,o)=>s+computeOrderTotals(o.items,o).total,0); }

  const salesToday = revenueOf(ordersSince(startOfDay));
  const salesWeek = revenueOf(ordersSince(startOfWeek));
  const salesMonth = revenueOf(ordersSince(startOfMonth));
  const salesYear = revenueOf(ordersSince(startOfYear));

  const totalOrders = db.orders.length;
  const firstOrderTs = totalOrders ? Math.min(...db.orders.map(o=>o.creado)) : Date.now();
  const daysSinceFirst = Math.max(1, Math.ceil((Date.now()-firstOrderTs)/86400000));
  const avgPerDay = (totalOrders/daysSinceFirst).toFixed(1);
  const avgPerWeek = (totalOrders/(daysSinceFirst/7)).toFixed(1);
  const avgTicket = totalOrders ? Math.round(revenueOf(db.orders)/totalOrders) : 0;

  const byClient = {};
  db.orders.forEach(o=>{ (byClient[o.userId]=byClient[o.userId]||[]).push(o); });
  const newClients = db.users.filter(u=>(Date.now()-u.registeredAt) <= 30*86400000).length;
  const recurringClients = Object.values(byClient).filter(arr=>arr.length>1).length;
  const lostClients = Object.values(byClient).filter(arr=>(Date.now()-Math.max(...arr.map(o=>o.creado))) > 30*86400000).length;
  const topClients = Object.entries(byClient).map(([uid,arr])=>({name:(db.users.find(u=>u.id===uid)||{}).name||uid, count:arr.length})).sort((a,b)=>b.count-a.count).slice(0,5);

  const serviceQty = {}; const categoryRevenue = {};
  db.orders.forEach(o=>{
    o.items.forEach(it=>{
      const p = priceEntry(it.tipo);
      const label = it.tipo==='other' ? (lang==='is'?'Annað':'Other') : (p[lang]||p.en);
      serviceQty[label] = (serviceQty[label]||0)+it.cant;
      const cost = computeItemCost(it);
      if(cost!==null) categoryRevenue[p.category] = (categoryRevenue[p.category]||0)+cost;
    });
  });
  const topServices = Object.entries(serviceQty).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([label,value])=>({label,value}));
  const catRows = Object.entries(categoryRevenue).sort((a,b)=>b[1]-a[1]).map(([cat,value])=>({label:(CATEGORIES[cat]||{})[lang]||cat, value}));

  const hourBuckets = ["00–04","04–08","08–12","12–16","16–20","20–24"];
  const hourCounts = new Array(6).fill(0);
  db.orders.forEach(o=>{ hourCounts[Math.floor(new Date(o.creado).getHours()/4)]++; });
  const peakRows = hourBuckets.map((b,i)=>({label:b, value:hourCounts[i]}));

  const statusCounts = {}; ESTADOS.forEach(e=>statusCounts[e]=db.orders.filter(o=>o.estado===e).length);
  const statusRows = ESTADOS.map(e=>({label:statusLabel(e), value:statusCounts[e], color:STATUS_COLOR[e]}));

  const delivered = db.orders.filter(o=>o.deliveredAt);
  const avgTurnaroundHrs = delivered.length ? (delivered.reduce((s,o)=>s+(o.deliveredAt-o.creado),0)/delivered.length/3600000).toFixed(1) : null;

  const days = [];
  for(let i=13;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const count=db.orders.filter(o=>{const od=new Date(o.creado);od.setHours(0,0,0,0);return od.getTime()===d.getTime();}).length; days.push({date:d,count}); }

  const revByClientName = {};
  db.orders.forEach(o=>{ revByClientName[orderClientName(o)] = (revByClientName[orderClientName(o)]||0) + computeOrderTotals(o.items,o).total; });
  const revenueByClient = Object.entries(revByClientName).map(([name,value])=>({label:name,value})).sort((a,b)=>b.value-a.value).slice(0,6);

  const overdueList = db.orders.filter(isOverdue);
  const urgentList = db.orders.filter(o=>o.urgent && o.estado!=='entregado');
  const problemList = db.orders.filter(o=>o.problem);
  const waitingList = db.orders.filter(o=>o.estado==='en-cola' && (Date.now()-o.creado)>24*3600000);

  return {salesToday,salesWeek,salesMonth,salesYear,totalOrders,avgPerDay,avgPerWeek,avgTicket,
    newClients,recurringClients,lostClients,topClients,topServices,catRows,peakRows,statusRows,
    avgTurnaroundHrs,days,overdueList,urgentList,problemList,waitingList,revenueByClient};
}

/* ---- T-contract-volume: daily kilos/units processed report (billing basis
   for contract clients like HSN Husavik and Hvammur, but works for any
   client) ---- */
function fmtQty(v, unit){ return unit==='kg' ? (Math.round(v*10)/10).toLocaleString(lang==='is'?'is-IS':'en-GB') : Math.round(v).toLocaleString(lang==='is'?'is-IS':'en-GB'); }
function csvEscape(v){ const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function computeVolumeReport(startISO, endISO, clientId){
  const start = new Date(startISO+'T00:00:00');
  const end = new Date(endISO+'T00:00:00'); end.setDate(end.getDate()+1); // exclusive upper bound
  const orders = db.orders.filter(o=>{
    if(o.creado < start.getTime() || o.creado >= end.getTime()) return false;
    if(clientId && clientId!=='all' && o.userId!==clientId) return false;
    return true;
  });
  const productIds = [...db.products].sort((a,b)=>a.sortOrder-b.sortOrder).map(p=>p.id);
  const byDay = {}; const totals = {};
  orders.forEach(o=>{
    const d = new Date(o.creado); d.setHours(0,0,0,0);
    const key = d.toISOString().slice(0,10);
    byDay[key] = byDay[key] || {};
    o.items.forEach(it=>{
      byDay[key][it.tipo] = (byDay[key][it.tipo]||0) + it.cant;
      totals[it.tipo] = (totals[it.tipo]||0) + it.cant;
    });
  });
  const activeProductIds = productIds.filter(id=>totals[id]);
  const days = [];
  for(let d=new Date(start); d<end; d.setDate(d.getDate()+1)){
    const key = d.toISOString().slice(0,10);
    days.push({date:key, values: byDay[key]||{}});
  }
  return { days, activeProductIds, totals, orderCount: orders.length };
}

/* ---- T7+E5: per-product-type ISK billing summary for a single contract
   client over a date range. Reuses computeVolumeReport's date/client
   filtering approach. Items with no price yet (computeItemCost===null,
   i.e. an unpriced "other" entry) are excluded from every total and
   surfaced via pendingCount instead of being counted as zero. productRows
   only lists products with a nonzero total for the range (sorted by
   sortOrder), so a zero-order range yields an empty list rather than an
   all-zero table. ----*/
function computeBillingSummary(startISO, endISO, clientId){
  const start = new Date(startISO+'T00:00:00');
  const end = new Date(endISO+'T00:00:00'); end.setDate(end.getDate()+1); // exclusive upper bound
  const orders = db.orders.filter(o=>{
    if(o.creado < start.getTime() || o.creado >= end.getTime()) return false;
    if(clientId && clientId!=='all' && o.userId!==clientId) return false;
    return true;
  });
  // Grouped by p.key rather than category (desktop-layout-redesign pass).
  // Safe because every product's key is hard-set to its own id (see
  // priceEntry()/db.products loader: key:p.id) — if a future products-admin
  // feature ever lets key diverge from id, two products could collide on
  // the same bucket here and silently double-count into grandTotal.
  const productTotals = {}; let pendingCount = 0;
  orders.forEach(o=>{
    o.items.forEach(it=>{
      const p = priceEntry(it.tipo);
      const cost = computeItemCost(it);
      if(cost===null){ pendingCount++; return; }
      productTotals[p.key] = (productTotals[p.key]||0) + cost;
    });
  });
  const productRows = [...db.products]
    .filter(p=>productTotals[p.key])
    .sort((a,b)=>a.sortOrder-b.sortOrder)
    .map(p=>({key:p.key, label:p[lang]||p.en, value:productTotals[p.key]}));
  const itemsTotal = productRows.reduce((s,r)=>s+r.value,0);
  const transportes = orders.reduce((s,o)=>s
    + (o.returnMethod==='delivery' ? db.settings.deliveryFee : 0)
    + (o.pickup ? db.settings.pickupFee : 0), 0);
  const expressFee = orders.reduce((s,o)=>{
    if(!o.urgent) return s;
    const orderItemsTotal = o.items.reduce((si,it)=>{ const c = computeItemCost(it); return c===null ? si : si+c; }, 0);
    return s + Math.round(orderItemsTotal * (db.settings.expressPercent/100));
  }, 0);
  const discount = db.settings.discountPercent ? Math.round(itemsTotal * (db.settings.discountPercent/100)) : 0;
  const grandTotal = Math.max(0, itemsTotal + transportes + expressFee - discount);
  return { productRows, transportes, expressFee, discount, grandTotal, pendingCount, orderCount: orders.length };
}

function exportVolumeCSV(){
  const r = computeVolumeReport(volumeStart, volumeEnd, volumeClientFilter);
  if(r.activeProductIds.length===0){ toast(t('rep_no_data')); return; }
  const header = [t('rep_volume_day'), ...r.activeProductIds.map(id=>{ const p=db.products.find(x=>x.id===id); return p ? `${p[lang]||p.en} (${p.unit})` : id; })];
  const rows = r.days.map(day=>[day.date, ...r.activeProductIds.map(id=> day.values[id]||0)]);
  const totalsRow = [t('rep_volume_total'), ...r.activeProductIds.map(id=> r.totals[id]||0)];
  const csv = [header, ...rows, totalsRow].map(row=>row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `thvottafelagid-volumen_${volumeStart}_${volumeEnd}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---- shared login helper for the three login buttons ---- */
async function attemptLogin(expectedRoles, targetViewMode, tabAssign){
  const emailEl = document.getElementById('login-email');
  const passEl = document.getElementById('login-pass');
  const email = (emailEl?.value||'').trim().toLowerCase();
  const pass = (passEl?.value||'').trim();
  if(!email || !pass){ toast(t('err_fill_all')); return; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ toast(t('err_email_pass')); return; }
    const { data: profile, error: profErr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
    if(profErr || !profile){ await sb.auth.signOut(); toast(t('err_generic')); return; }
    if(!expectedRoles.includes(profile.role)){ await sb.auth.signOut(); toast(t('err_role_mismatch')); return; }
    session = { role: targetViewMode, userId: profile.id, actualRole: profile.role };
    viewMode = targetViewMode;
    if(tabAssign) tabAssign();
    await loadDataForSession();
    render();
  } catch(e){ console.error('attemptLogin', e); toast(t('err_generic')); }
}

function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang = b.dataset.lang; render(); });
  app.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{
    const target = b.dataset.switch;
    const allowed = target==='client' ? session.actualRole==='client'
                  : target==='staff'  ? ['staff','admin'].includes(session.actualRole)
                  : session.actualRole==='admin';
    if(!allowed){
      if(target==='client'){
        session = {role:null, userId:null, actualRole:null}; authScreen='login';
        toast(lang==='is'?'Skráðu þig inn sem viðskiptavinur fyrst':'Sign in as a client first');
      } else {
        toast(t('err_role_mismatch'));
      }
      render(); return;
    }
    viewMode = target; session.role = target; render();
  });

  const goReg = document.getElementById('go-registro'); if(goReg) goReg.onclick=()=>{authScreen='registro'; render();};
  const goLogin = document.getElementById('go-login'); if(goLogin) goLogin.onclick=()=>{authScreen='login'; render();};
  const goForgot = document.getElementById('go-forgot'); if(goForgot) goForgot.onclick=()=>{authScreen='forgot'; render();};
  const goLoginFromForgot = document.getElementById('go-login-from-forgot'); if(goLoginFromForgot) goLoginFromForgot.onclick=()=>{authScreen='login'; render();};

  const btnSendReset = document.getElementById('btn-send-reset');
  if(btnSendReset) btnSendReset.onclick = async ()=>{
    const email = document.getElementById('forgot-email').value.trim().toLowerCase();
    if(!email){ toast(t('err_fill_all')); return; }
    try{
      await sbAnon.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
      toast(t('reset_link_sent')); authScreen='login'; render();
    } catch(e){ console.error('resetPasswordForEmail', e); toast(t('err_generic')); }
  };

  const btnLogin = document.getElementById('btn-login');
  if(btnLogin) btnLogin.onclick = ()=> attemptLogin(['client'], 'client', null);
  const btnStaffLogin = document.getElementById('btn-staff-login');
  if(btnStaffLogin) btnStaffLogin.onclick = ()=> attemptLogin(['staff','admin'], 'staff', ()=>{ staffTab='today'; });
  const btnAdminLogin = document.getElementById('btn-admin-login');
  if(btnAdminLogin) btnAdminLogin.onclick = ()=> attemptLogin(['admin'], 'admin', ()=>{ adminTab='reports'; });

  const btnRegistro = document.getElementById('btn-registro');
  if(btnRegistro) btnRegistro.onclick = async ()=>{
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim().toLowerCase();
    const phone = document.getElementById('reg-phone').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    const preferredLangEl = document.getElementById('reg-preferred-lang');
    const preferredLang = preferredLangEl ? preferredLangEl.value : 'is';
    if(!name || !email || !phone || !pass){ toast(t('err_fill_all')); return; }
    if(pass.length < 6){ toast(t('err_password_short')); return; }
    try{
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name, phone, preferred_lang: preferredLang } } });
      if(error){ toast(error.message && /already/i.test(error.message) ? t('err_email_exists') : t('err_generic')); return; }
      if(data.session){
        const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
        session = { role:'client', userId:data.user.id, actualRole: profile ? profile.role : 'client' };
        viewMode = 'client';
        await loadDataForSession();
        render();
      } else {
        toast(t('confirm_email_sent')); authScreen='login'; render();
      }
    } catch(e){ console.error('signUp', e); toast(t('err_generic')); }
  };

  const btnLogout = document.getElementById('btn-logout');
  if(btnLogout) btnLogout.onclick = async ()=>{ await sb.auth.signOut(); session={role:null,userId:null,actualRole:null}; authScreen='login'; render(); };

  const btnSetPassword = document.getElementById('btn-set-password');
  if(btnSetPassword) btnSetPassword.onclick = async ()=>{
    const p1 = document.getElementById('recovery-pass').value.trim();
    const p2 = document.getElementById('recovery-pass2').value.trim();
    if(p1.length < 6){ toast(t('err_password_short')); return; }
    if(p1 !== p2){ toast(t('err_password_mismatch')); return; }
    try{
      const { error } = await sb.auth.updateUser({ password: p1 });
      if(error){ toast(t('err_generic')); return; }
      await sb.auth.signOut();
      session = {role:null, userId:null, actualRole:null}; authScreen='login';
      toast(t('password_updated')); render();
    } catch(e){ console.error('updateUser', e); toast(t('err_generic')); }
  };

  const btnNueva = document.getElementById('btn-nueva-orden');
  if(btnNueva) btnNueva.onclick = ()=>{
    sheetMode = 'client';
    orderDraftItems = [{tipo:activeProducts()[0].key, cant:1, desc:''}];
    orderDraftMods = {urgent:false, returnMethod:'store', pickup:false, pickupAddress:''};
    orderDraftFecha = '';
    sheetOpen = true; render();
  };
  const btnLogOrder = document.getElementById('btn-log-order');
  if(btnLogOrder) btnLogOrder.onclick = ()=>{
    sheetMode = 'manual';
    orderDraftItems = [{tipo:activeProducts()[0].key, cant:1, desc:''}];
    orderDraftMods = {urgent:false, returnMethod:'store', pickup:false, pickupAddress:''};
    orderDraftManualClientId = ''; orderDraftManualName = '';
    orderDraftFecha = todayISO();
    sheetOpen = true; render();
  };
  const btnCancel = document.getElementById('btn-cancel-orden'); if(btnCancel) btnCancel.onclick=()=>{ sheetOpen=false; render(); };
  const backdrop = document.getElementById('sheet-backdrop'); if(backdrop) backdrop.onclick=()=>{ sheetOpen=false; render(); };

  const manualClientSelect = document.getElementById('manual-client-select');
  if(manualClientSelect) manualClientSelect.onchange = ()=>{ orderDraftManualClientId = manualClientSelect.value; };
  const manualClientName = document.getElementById('manual-client-name');
  if(manualClientName) manualClientName.oninput = ()=>{ orderDraftManualName = manualClientName.value; };
  const ordenFecha = document.getElementById('orden-fecha');
  if(ordenFecha) ordenFecha.oninput = ()=>{ orderDraftFecha = ordenFecha.value; };
  app.querySelectorAll('input[name="return-method"]').forEach(el=>el.onchange=()=>{ orderDraftMods.returnMethod = el.value; render(); });

  const addItemBtn = document.getElementById('add-item-btn');
  if(addItemBtn && sheetOpen) addItemBtn.onclick = ()=>{ orderDraftItems.push({tipo:activeProducts()[0].key, cant:1, desc:''}); render(); };
  app.querySelectorAll('[data-remove-item]').forEach(b=>b.onclick=()=>{ orderDraftItems.splice(parseInt(b.dataset.removeItem),1); render(); });
  app.querySelectorAll('[data-item-tipo]').forEach(el=>el.onchange=()=>{ orderDraftItems[parseInt(el.dataset.itemTipo)].tipo = el.value; render(); });
  app.querySelectorAll('[data-item-cant]').forEach(el=>el.onchange=()=>{ orderDraftItems[parseInt(el.dataset.itemCant)].cant = Math.max(1, parseInt(el.value)||1); render(); });
  app.querySelectorAll('[data-item-desc]').forEach(el=>el.oninput=()=>{ orderDraftItems[parseInt(el.dataset.itemDesc)].desc = el.value; });

  const ou = document.getElementById('orden-urgent'); if(ou) ou.onchange=()=>{ orderDraftMods.urgent=ou.checked; render(); };
  const op = document.getElementById('orden-pickup'); if(op) op.onchange=()=>{ orderDraftMods.pickup=op.checked; render(); };
  const opa = document.getElementById('orden-pickup-address'); if(opa) opa.oninput=()=>{ orderDraftMods.pickupAddress=opa.value; };

  const btnSubmitOrden = document.getElementById('btn-submit-orden');
  if(btnSubmitOrden) btnSubmitOrden.onclick = async ()=>{
    const fecha = document.getElementById('orden-fecha').value;
    const comentarios = document.getElementById('orden-comentarios').value.trim();
    if(!fecha){ toast(t('err_pick_date')); return; }
    if(orderDraftItems.some(it=>it.tipo==='other' && !it.desc.trim())){ toast(t('err_other_desc')); return; }
    if(db.settings.pickupEnabled && orderDraftMods.pickup && !orderDraftMods.pickupAddress.trim()){ toast(t('err_pickup_address')); return; }

    const itemsPayload = orderDraftItems.map(it=>({
      product_id: it.tipo, qty: it.cant, price_override: null, desc: it.desc || null
    }));

    try{
      if(sheetMode==='manual'){
        let clientId = null, clientName = null;
        if(orderDraftManualClientId){
          const user = db.users.find(u=>u.id===orderDraftManualClientId);
          if(!user){ toast(t('err_manual_client')); return; }
          clientId = user.id; clientName = user.name;
        } else if(orderDraftManualName.trim()){
          clientId = null; clientName = orderDraftManualName.trim();
        } else { toast(t('err_manual_client')); return; }

        const { error } = await sb.rpc('log_manual_order', {
          p_client_id: clientId, p_client_name: clientName, p_fecha: fecha,
          p_comentarios: comentarios || null, p_urgent: orderDraftMods.urgent,
          p_return_method: orderDraftMods.returnMethod, p_pickup: orderDraftMods.pickup,
          p_pickup_address: orderDraftMods.pickup ? (orderDraftMods.pickupAddress.trim() || null) : null,
          p_items: itemsPayload
        });
        if(error) throw error;
        toast(t('manual_order_logged'));
      } else {
        const { data: orderRow, error: orderErr } = await sb.from('orders').insert({
          client_id: session.userId, client_name: null, fecha, comentarios: comentarios || null,
          estado: 'en-cola', urgent: orderDraftMods.urgent, return_method: orderDraftMods.returnMethod,
          pickup: orderDraftMods.pickup,
          pickup_address: orderDraftMods.pickup ? (orderDraftMods.pickupAddress.trim() || null) : null,
          source: 'client'
        }).select().single();
        if(orderErr) throw orderErr;
        const { error: itemsErr } = await sb.from('order_items').insert(
          itemsPayload.map(it=>({ order_id: orderRow.id, ...it }))
        );
        if(itemsErr) throw itemsErr;
        toast(t('order_sent'));
      }
      await loadOrders();
      sheetOpen = false; render();
    } catch(e){ console.error('submit order', e); toast(t('err_generic')); }
  };

  app.querySelectorAll('[data-clientsubtab]').forEach(b=>b.onclick=()=>{ clientSubTab=b.dataset.clientsubtab; selectedOrderId=null; render(); });
  app.querySelectorAll('[data-orderrow]').forEach(b=>b.onclick=()=>{ selectedOrderId=b.dataset.orderrow; render(); });
  app.querySelectorAll('[data-stafftab]').forEach(b=>b.onclick=()=>{ staffTab=b.dataset.stafftab; staffQuickFilter=null; addingClient=false; editingClientId=null; render(); });
  app.querySelectorAll('[data-admintab]').forEach(b=>b.onclick=()=>{ adminTab=b.dataset.admintab; editingProductId=null; addingProduct=false; addingClient=false; editingClientId=null; render(); });
  app.querySelectorAll('[data-quickfilter]').forEach(b=>b.onclick=()=>{ staffQuickFilter=b.dataset.quickfilter; staffFilter='todos'; staffClientFilter='todos'; staffTab='orders'; render(); });
  const clearQF = document.getElementById('clear-quickfilter'); if(clearQF) clearQF.onclick=()=>{ staffQuickFilter=null; render(); };

  const clientFilterSelect = document.getElementById('staff-client-filter');
  if(clientFilterSelect) clientFilterSelect.onchange = (e)=>{ staffClientFilter=e.target.value; render(); };

  const volStart = document.getElementById('vol-start'); if(volStart) volStart.onchange = (e)=>{ volumeStart=e.target.value; render(); };
  const volEnd = document.getElementById('vol-end'); if(volEnd) volEnd.onchange = (e)=>{ volumeEnd=e.target.value; render(); };
  const volClient = document.getElementById('vol-client'); if(volClient) volClient.onchange = (e)=>{ volumeClientFilter=e.target.value; render(); };
  const volExport = document.getElementById('vol-export'); if(volExport) volExport.onclick = exportVolumeCSV;
  app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ staffFilter=b.dataset.filter; staffQuickFilter=null; render(); });
  app.querySelectorAll('[data-view-client]').forEach(b=>b.onclick=()=>{ staffClientFilter=b.dataset.viewClient; staffFilter='todos'; staffQuickFilter=null; if(session.role==='staff') staffTab='orders'; else adminTab='orders'; render(); });

  const btnAddClient = document.getElementById('btn-add-client');
  if(btnAddClient) btnAddClient.onclick = ()=>{ addingClient = true; editingClientId=null; render(); };
  const cfCancel = document.getElementById('cf-cancel'); if(cfCancel) cfCancel.onclick = ()=>{ addingClient=false; render(); };
  const cfSave = document.getElementById('cf-save');
  if(cfSave) cfSave.onclick = async ()=>{
    const name = document.getElementById('cf-name').value.trim();
    const email = document.getElementById('cf-email').value.trim().toLowerCase();
    const phone = document.getElementById('cf-phone').value.trim();
    const contractEl = document.getElementById('cf-contract');
    if(!name || !email || !phone){ toast(t('err_fill_all')); return; }
    try{
      // Throwaway random password: the client never uses it — resetPasswordForEmail
      // below sends them a link to set their own. sbAnon keeps this signUp from
      // clobbering the staff/admin caller's own session.
      const randomPass = Math.random().toString(36).slice(-10) + 'Aa1!';
      const { data, error } = await sbAnon.auth.signUp({ email, password: randomPass, options: { data: { name, phone } } });
      if(error){ toast(error.message && /already/i.test(error.message) ? t('err_email_exists') : t('err_generic')); return; }
      if(contractEl && contractEl.checked){
        const { error: updErr } = await sb.from('profiles').update({ is_contract: true }).eq('id', data.user.id);
        if(updErr) console.error('set is_contract', updErr);
      }
      await sbAnon.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
      addingClient=false; toast(t('client_registered'));
      await loadUsers(); render();
    } catch(e){ console.error('register client', e); toast(t('err_generic')); }
  };

  app.querySelectorAll('[data-customize-client]').forEach(b=>b.onclick=()=>{ editingClientId=b.dataset.customizeClient; addingClient=false; render(); });
  const ceCancel = document.getElementById('ce-cancel'); if(ceCancel) ceCancel.onclick = ()=>{ editingClientId=null; render(); };
  const ceSave = document.getElementById('ce-save');
  if(ceSave) ceSave.onclick = async ()=>{
    const u = db.users.find(x=>x.id===ceSave.dataset.editingClient);
    const name = document.getElementById('ce-name').value.trim();
    const email = document.getElementById('ce-email').value.trim().toLowerCase();
    const phone = document.getElementById('ce-phone').value.trim();
    if(!name || !email || !phone){ toast(t('err_fill_all')); return; }
    try{
      const { error } = await sb.from('profiles').update({
        name, email, phone,
        notifications_enabled: document.getElementById('ce-notifications').checked,
        is_contract: document.getElementById('ce-contract').checked
      }).eq('id', u.id);
      if(error) throw error;
      editingClientId=null; toast(t('client_updated'));
      await loadUsers(); render();
    } catch(e){ console.error('update client', e); toast(t('err_generic')); }
  };
  const ceResetPass = document.getElementById('ce-reset-pass');
  if(ceResetPass) ceResetPass.onclick = async ()=>{
    const u = db.users.find(x=>x.id===ceResetPass.dataset.resetClient);
    if(!u) return;
    try{
      await sbAnon.auth.resetPasswordForEmail(u.email, { redirectTo: window.location.origin + window.location.pathname });
      toast(t('password_reset_sent'));
    } catch(e){ console.error('resetPasswordForEmail', e); toast(t('err_generic')); }
  };

  app.querySelectorAll('[data-advance]').forEach(b=>b.onclick=async ()=>{
    try{
      const { error } = await sb.rpc('advance_order_status', { p_order_id: b.dataset.advance });
      if(error) throw error;
      await loadOrders(); render(); toast(t('order_updated'));
    } catch(e){ console.error('advance_order_status', e); toast(t('err_generic')); }
  });
  app.querySelectorAll('[data-hold]').forEach(b=>b.onclick=async ()=>{
    try{
      const { error } = await sb.rpc('flag_problem', { p_order_id: b.dataset.hold, p_flagged: true });
      if(error) throw error;
      await loadOrders(); render(); toast(t('note_added'));
    } catch(e){ console.error('flag_problem', e); toast(t('err_generic')); }
  });
  app.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async ()=>{
    try{
      const { error } = await sb.rpc('flag_problem', { p_order_id: b.dataset.resolve, p_flagged: false });
      if(error) throw error;
      await loadOrders(); render(); toast(t('issue_resolved'));
    } catch(e){ console.error('flag_problem', e); toast(t('err_generic')); }
  });
  app.querySelectorAll('[data-note-submit]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.noteSubmit;
    const input = app.querySelector(`[data-note-input="${id}"]`);
    const val = input.value.trim(); if(!val) return;
    try{
      const { error } = await sb.rpc('add_order_note', { p_order_id: id, p_note: val });
      if(error) throw error;
      await loadOrders(); render(); toast(t('note_added'));
    } catch(e){ console.error('add_order_note', e); toast(t('err_generic')); }
  });

  /* ---- Admin: products CRUD ---- */
  const btnAddProduct = document.getElementById('btn-add-product');
  if(btnAddProduct) btnAddProduct.onclick = ()=>{ addingProduct=true; editingProductId=null; render(); };
  app.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>{ editingProductId=b.dataset.editProduct; addingProduct=false; render(); });
  const pfCancel = document.getElementById('pf-cancel'); if(pfCancel) pfCancel.onclick=()=>{ editingProductId=null; addingProduct=false; render(); };
  const pfSave = document.getElementById('pf-save');
  if(pfSave) pfSave.onclick = async ()=>{
    const en = document.getElementById('pf-en').value.trim();
    const is = document.getElementById('pf-is').value.trim();
    const priceRaw = document.getElementById('pf-price').value;
    const price = priceRaw==='' ? null : Math.max(0, parseInt(priceRaw)||0);
    const unit = document.getElementById('pf-unit').value;
    const category = document.getElementById('pf-category').value;
    const active = document.getElementById('pf-active').checked;
    const staffOnly = document.getElementById('pf-staff-only').checked;
    if(!en || !is){ toast(t('err_product_fields')); return; }
    const editing = pfSave.dataset.editing;
    try{
      if(editing==='new'){
        const key = 'p_'+Date.now();
        const maxOrder = Math.max(0, ...db.products.map(p=>p.sortOrder));
        const { error } = await sb.from('products').insert({
          id: key, name_en: en, name_is: is, price, unit, category, active, sort_order: maxOrder+1, staff_only: staffOnly
        });
        if(error) throw error;
        addingProduct=false; toast(t('product_added'));
      } else {
        const { error } = await sb.from('products').update({
          name_en: en, name_is: is, price, unit, category, active, staff_only: staffOnly
        }).eq('id', editing);
        if(error) throw error;
        editingProductId=null; toast(t('product_updated'));
      }
      await loadProducts(); render();
    } catch(e){ console.error('save product', e); toast(t('err_generic')); }
  };
  app.querySelectorAll('[data-toggle-active]').forEach(b=>b.onclick=async ()=>{
    const p = db.products.find(x=>x.id===b.dataset.toggleActive);
    try{
      const { error } = await sb.from('products').update({ active: !p.active }).eq('id', p.id);
      if(error) throw error;
      await loadProducts(); render();
    } catch(e){ console.error('toggle active', e); toast(t('err_generic')); }
  });
  app.querySelectorAll('[data-move-up]').forEach(b=>b.onclick=async ()=>{
    const products = [...db.products].sort((a,b)=>a.sortOrder-b.sortOrder);
    const idx = products.findIndex(p=>p.id===b.dataset.moveUp);
    if(idx>0){
      const a = products[idx], bItem = products[idx-1];
      try{
        await Promise.all([
          sb.from('products').update({ sort_order: bItem.sortOrder }).eq('id', a.id),
          sb.from('products').update({ sort_order: a.sortOrder }).eq('id', bItem.id)
        ]);
        await loadProducts(); render();
      } catch(e){ console.error('move up', e); toast(t('err_generic')); }
    }
  });
  app.querySelectorAll('[data-move-down]').forEach(b=>b.onclick=async ()=>{
    const products = [...db.products].sort((a,b)=>a.sortOrder-b.sortOrder);
    const idx = products.findIndex(p=>p.id===b.dataset.moveDown);
    if(idx<products.length-1){
      const a = products[idx], bItem = products[idx+1];
      try{
        await Promise.all([
          sb.from('products').update({ sort_order: bItem.sortOrder }).eq('id', a.id),
          sb.from('products').update({ sort_order: a.sortOrder }).eq('id', bItem.id)
        ]);
        await loadProducts(); render();
      } catch(e){ console.error('move down', e); toast(t('err_generic')); }
    }
  });
  app.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=async ()=>{
    const pid = b.dataset.deleteProduct;
    const used = db.orders.some(o=>o.items.some(it=>it.tipo===pid));
    if(used){ toast(t('cannot_delete_used')); return; }
    if(!confirm(t('confirm_delete'))) return;
    try{
      const { error } = await sb.from('products').delete().eq('id', pid);
      if(error) throw error;
      toast(t('product_deleted'));
      await loadProducts(); render();
    } catch(e){ console.error('delete product', e); toast(t('err_generic')); }
  });

  /* ---- Admin: pricing ---- */
  const btnSavePricing = document.getElementById('btn-save-pricing');
  if(btnSavePricing) btnSavePricing.onclick = async ()=>{
    const payload = {
      express_percent: Math.max(0, parseInt(document.getElementById('set-express').value)||0),
      delivery_fee: Math.max(0, parseInt(document.getElementById('set-delivery').value)||0),
      pickup_fee: Math.max(0, parseInt(document.getElementById('set-pickup').value)||0),
      discount_percent: Math.max(0, parseInt(document.getElementById('set-discount').value)||0),
      delivery_enabled: document.getElementById('set-delivery-enabled').checked,
      pickup_enabled: document.getElementById('set-pickup-enabled').checked
    };
    try{
      const { error } = await sb.from('settings').update(payload).eq('id', 1);
      if(error) throw error;
      toast(t('pricing_saved'));
      await loadSettings(); render();
    } catch(e){ console.error('save pricing', e); toast(t('err_generic')); }
  };

  /* ---- Admin: quotes (assign price to "Other" items) ---- */
  app.querySelectorAll('[data-quote-price]').forEach(el=>el.oninput=()=>{ quotePriceDrafts[el.dataset.quotePrice] = el.value; });
  app.querySelectorAll('[data-quote-save]').forEach(b=>b.onclick=async ()=>{
    const itemId = b.dataset.quoteSave;
    const val = quotePriceDrafts[itemId];
    const price = parseInt(val);
    if(isNaN(price) || price<0){ toast(t('err_product_fields')); return; }
    try{
      const { error } = await sb.rpc('assign_item_price', { p_order_item_id: itemId, p_price: price });
      if(error) throw error;
      delete quotePriceDrafts[itemId];
      toast(t('price_assigned'));
      await loadOrders(); render();
    } catch(e){ console.error('assign_item_price', e); toast(t('err_generic')); }
  });
}

/* ============ BOOTSTRAP ============ */
sb.auth.onAuthStateChange((event, _authSession)=>{
  if(event === 'PASSWORD_RECOVERY'){
    authScreen = 'recovery';
    render();
  }
});

(async function bootstrap(){
  try{
    const { data: { session: authSession } } = await sb.auth.getSession();
    if(authSession){
      const { data: profile, error } = await sb.from('profiles').select('*').eq('id', authSession.user.id).single();
      if(!error && profile){
        session = { role: profile.role, userId: profile.id, actualRole: profile.role };
        viewMode = profile.role;
        await loadDataForSession();
      }
    }
  } catch(e){ console.error('bootstrap session restore', e); }
  render();
  startPolling();
})();
</script>
</body>
</html>
